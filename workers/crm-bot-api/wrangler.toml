name = "crm-assistant-gateway"
main = "worker.js"
compatibility_date = "2026-10-16"

# 這不是密語。Firebase 專案與 CRM 頁面相同。
[vars]
FIREBASE_PROJECT_ID = "fish-teem"

# 下面這些不要寫進這個檔案，也不要寫進聊天。
# 用 wrangler secret put 設定：
#   BOT_KEYS          例如 {"助理甲":"一長串亂碼"}
#   APPROVAL_SECRET   擁有者自己保管的確認碼，不要交給機器人
#   FIREBASE_API_KEY
#   BOT_EMAIL
#   BOT_PASSWORD
#   TEAM_ID

# 行動闖關寫入（預設關閉；規則更新後才開）：
#   QUEST_AUTO_WRITE = "1"
#   QUEST_OWNER_UID  = 擁有者的 Firebase UID
#   QUEST_OWNER_EMAIL = "shanewangmusic@gmail.com"（不設就是這個）
